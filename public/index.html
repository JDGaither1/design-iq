BEDROOM (P2): White bedding always, BUT add visual drama through the headboard wall — accent wallpaper, bold paint, or a statement headboard. Symmetrical nightstands with matching lamps. Layer textures: linen, knit throw, velvet or patterned accent pillows in the palette accent color. Blackout curtains that puddle slightly.
KITCHEN (P3): Max 3-4 counter items but make them PHOTOGENIC — a wooden cutting board, a matte black coffee maker, a small herb plant. Under-cabinet lighting is non-negotiable. Upgrade hardware to something with personality (brass, matte black, leather pulls). One styled moment — a cookbook display, a patterned backsplash, or open shelving with curated items.

const detectVendor = (url) => { if (!url) return "other"; const u = url.toLowerCase(); for (const [d, v] of Object.entries(VENDOR_DOMAINS)) if (u.includes(d)) return v; return "other"; };

// Generate a retailer search URL as fallback when AI doesn't provide a real product link
const buildSearchUrl = (query, retailer) => {
  const q = encodeURIComponent(query);
  const urls = {
    amazon: `https://www.amazon.com/s?k=${q}`,
    wayfair: `https://www.wayfair.com/keyword.php?keyword=${q}`,
    etsy: `https://www.etsy.com/search?q=${q}`,
    walmart: `https://www.walmart.com/search?q=${q}`,
    target: `https://www.target.com/s?searchTerm=${q}`,
    ikea: `https://www.ikea.com/us/en/search/?q=${q}`,
  };
  return urls[retailer] || urls.amazon;
};

// Check if a URL looks real (not fabricated)
const isRealUrl = (url) => {
  if (!url || url.length < 15) return false;
  // Reject obvious fakes: made-up ASINs, generic homepages, search pages
  if (/amazon\.com\/dp\/B0[A-Z0-9]{8,}$/i.test(url) && !url.includes("?")) {
    // Bare Amazon dp links with no query params are often fabricated — but could be real
    // We'll treat them as potentially real but add a search fallback too
    return true;
  }
  if (/\/(s\?|search|keyword\.php)/.test(url)) return false; // already a search URL
  if (/^https?:\/\/[^\/]+\/?$/.test(url)) return false; // just a homepage
  return true;
};

// Get the best link for a product — real URL or fallback search
const getProductLink = (rec) => {
  const searchTerms = rec.searchQuery || rec.item;
  const retailer = rec.retailer || detectVendor(rec.url) || "amazon";
  if (rec.url && isRealUrl(rec.url)) {
    return { url: cleanUrl(rec.url), isDirect: true, searchUrl: buildSearchUrl(searchTerms, retailer) };
  }
  return { url: buildSearchUrl(searchTerms, retailer), isDirect: false, searchUrl: null };
};
const stripCites = (text) => { if (!text) return ""; return text.replace(/<\/?cite[^>]*>/gi, "").replace(/<\/?antml:cite[^>]*>/gi, "").replace(/\*\*(.*?)\*\*/g, "$1").replace(/\*(.*?)\*/g, "$1").trim(); };

// Clean URLs — strip tracking params that break pages
const cleanUrl = (url) => {
  if (!url) return "";
  try {
    const u = new URL(url);
    // Etsy: strip dd_referrer and other tracking params
    if (u.hostname.includes("etsy.com")) {
      u.searchParams.delete("dd_referrer");
      u.searchParams.delete("ref");
      u.searchParams.delete("ga_search_query");
      u.searchParams.delete("ga_search_type");
      u.searchParams.delete("ga_view_type");
      u.searchParams.delete("ga_order");
      u.searchParams.delete("click_key");
      u.searchParams.delete("click_sum");
      // Strip empty search string
      if (u.search === "?") u.search = "";
    }
    // Amazon: strip tracking but keep /dp/ URL intact
    if (u.hostname.includes("amazon.com")) {
      u.searchParams.delete("pd_rd_w");
      u.searchParams.delete("pd_rd_r");
      u.searchParams.delete("pf_rd_p");
      u.searchParams.delete("pf_rd_r");
      u.searchParams.delete("ref_");

};

async function callAI(systemPrompt, userContent, maxTokens = 2048, useWebSearch = false) {
  const body = {
    model: "claude-sonnet-4-20250514",
    max_tokens: maxTokens,
    system: systemPrompt,
    messages: [{ role: "user", content: userContent }],
  };
  if (useWebSearch) {
    body.tools = [{ type: "web_search_20250305", name: "web_search" }];
  }
  const res = await fetch("/api/ai", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) { const e = await res.text(); throw new Error(`API ${res.status}: ${e.substring(0, 120)}`); }
  const data = await res.json();
  if (!data.content?.length) throw new Error("Empty AI response");

  // Extract text from potentially mixed content (text + tool_use + tool_result blocks)
  const text = data.content
    .filter(b => b.type === "text")
    .map(b => b.text)
    .join("\n");

  const f = text.indexOf("{"), l = text.lastIndexOf("}");
  if (f === -1 || l <= f) throw new Error("No JSON found. Response: " + text.substring(0, 100));
  let json = text.substring(f, l + 1);
  try { return JSON.parse(json); } catch {
    const ob = (json.match(/\[/g)||[]).length - (json.match(/\]/g)||[]).length;
    const oc = (json.match(/\{/g)||[]).length - (json.match(/\}/g)||[]).length;
    for (let i = 0; i < ob; i++) json += "]";
    for (let i = 0; i < oc; i++) json += "}";
    return JSON.parse(json);
  }
}

function RefineChat({ currentData, promptTemplate, onUpdate, useWebSearch = false, placeholder, examples }) {
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [history, setHistory] = useState([]);
  const apiHistory = useRef([]); // tracks full conversation for API context

  const send = async (text) => {
    const userMsg = (text || input).trim();
    if (!userMsg || loading) return;
    setInput(""); setLoading(true); setError(null);
    setHistory(prev => [...prev, { role: "user", text: userMsg }]);
    try {
      const prompt = promptTemplate
        .replace("{CURRENT_PROFILE}", JSON.stringify(currentData))
        .replace("{CURRENT_RESULT}", JSON.stringify(currentData))
        .replace("{USER_FEEDBACK}", userMsg);

      // Build full message history for multi-turn context
      const messages = [
        ...apiHistory.current,
        { role: "user", content: userMsg },
      ];

      const resp = await fetch("/api/ai", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: useWebSearch ? 4096 : 1024,
          system: prompt,
          messages,
          ...(useWebSearch ? { tools: [{ type: "web_search_20250305", name: "web_search", max_uses: 5 }] } : {}),
        }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(`API ${resp.status}: ${JSON.stringify(data)}`);
      const aiText = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n").trim();
      const cleaned = stripCites(aiText);

      // Store the exchange in API history for next turn
      apiHistory.current = [
        ...apiHistory.current,
        { role: "user", content: userMsg },
        { role: "assistant", content: cleaned },
      ];

      try {
        const jsonMatch = cleaned.match(/\{[\s\S]*\}/);
        if (jsonMatch) {
          const parsed = JSON.parse(jsonMatch[0]);
          if (parsed.style || parsed.recommendations || parsed.name) {
            setHistory(prev => [...prev, { role: "ai", text: "✓ Updated based on your feedback" }]);
            onUpdate(parsed);
          } else {
            setHistory(prev => [...prev, { role: "ai", text: cleaned }]);
          }
        } else {
          setHistory(prev => [...prev, { role: "ai", text: cleaned }]);
        }
      } catch {
        setHistory(prev => [...prev, { role: "ai", text: cleaned }]);
      }
    } catch (err) {
      setError(err.message || "Something went wrong. Try again.");
      setHistory(prev => prev.slice(0, -1));
    }
    setLoading(false);
  };

  return (
    <div className="card-inner" style={{ padding: 16, marginBottom: 14 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
        <span style={{ fontSize: 16 }}>💬</span>
        <span style={{ fontSize: 14, fontWeight: 600, color: "#111827" }}>Refine with AI</span>
      </div>
      <p style={{ fontSize: 13, color: "#6b7280", margin: "0 0 10px", lineHeight: 1.5 }}>
        {useWebSearch
          ? "Want to change something? Ask a question or tell the AI what to swap — it will search for new products and update your recommendations."
          : "Want to tweak the palette or style? Ask a question or tell the AI what to change — it will update your design profile in real time."
        }
      </p>
      {history.length === 0 && examples && (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 10 }}>
          {examples.map((ex, i) => (
            <button key={i} onClick={() => { setInput(ex); }} style={{
              padding: "6px 12px", fontSize: 12, color: "#92400e",
              background: "linear-gradient(145deg, #fef3c7, #fde68a)",
              border: "1px solid rgba(217,119,6,0.15)", borderRadius: 8,
              cursor: "pointer", fontFamily: fonts, transition: "all 0.15s",
            }}>{ex}</button>
          ))}
        </div>
      )}
      {history.length > 0 && (
        <div style={{ marginBottom: 10, maxHeight: 280, overflowY: "auto" }}>
          {history.map((h, i) => (
            <div key={i} style={{ display: "flex", justifyContent: h.role === "user" ? "flex-end" : "flex-start", marginBottom: 4 }}>
              <div style={{
                padding: "6px 12px", borderRadius: 10, fontSize: 13, maxWidth: "85%", lineHeight: 1.5,
                background: h.role === "user" ? "linear-gradient(135deg, #e8a307, #d97706)" : h.text.startsWith("✓") ? "linear-gradient(145deg, #f0fdf4, #ecfce8)" : "linear-gradient(145deg, #f8f6f3, #f0eeeb)",
                color: h.role === "user" ? "#fff" : h.text.startsWith("✓") ? "#166534" : "#374151",
                fontWeight: h.text.startsWith("✓") ? 600 : 400,
                border: h.role === "ai" && !h.text.startsWith("✓") ? "1px solid rgba(0,0,0,0.06)" : "none",
              }}>{h.text}</div>
            </div>
          ))}
        </div>
      )}
      <div style={{ display: "flex", gap: 6 }}>
        <input value={input} onChange={e => setInput(e.target.value)} placeholder={placeholder || "e.g., swap the coral for terracotta"}
          onKeyDown={e => { if (e.key === "Enter") send(); }}
          style={{ flex: 1, padding: "10px 14px", fontSize: 14, border: "1px solid rgba(0,0,0,0.08)", borderRadius: 10, outline: "none", background: "linear-gradient(145deg, #ffffff, #fefdfb)", fontFamily: fonts }} />
        <button onClick={() => send()} disabled={loading || !input.trim()} style={{
          padding: "10px 16px", fontSize: 14, fontWeight: 600, border: "none", borderRadius: 10, cursor: loading ? "not-allowed" : "pointer",
          background: loading ? "linear-gradient(135deg, #92740a, #a17d08)" : "linear-gradient(135deg, #e8a307, #d97706)", color: loading ? "#fff" : "#fff",
          boxShadow: loading ? "none" : "0 2px 6px rgba(217,119,6,0.2)", transition: "all 0.2s", whiteSpace: "nowrap",
        }}>{loading ? <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}><span style={{ display: "inline-block", width: 14, height: 14, border: "2px solid rgba(255,255,255,0.3)", borderTopColor: "#fff", borderRadius: "50%", animation: "spin 0.8s linear infinite" }} /><span>AI is thinking</span><span style={{ animation: "thinking 1.5s ease-in-out infinite", letterSpacing: 1 }}>...</span></span> : "Send"}</button>
      </div>
      {error && <p style={{ fontSize: 12, color: "#dc2626", margin: "6px 0 0" }}>{error}</p>}
    </div>
  );
}

const CATEGORY_KEYWORDS = {
  "Accent Wall": ["wallpaper", "wall panel", "shiplap", "peel-and-stick", "peel and stick", "board and batten", "faux brick", "faux stone", "wall slat"],
  "Rug": ["rug", "area rug", "runner"],

  "Bedding / Textiles": ["duvet", "comforter", "sheet", "bedding", "quilt", "blanket", "coverlet", "bed set", "bed-in-a-bag"],
  "Curtains / Window": ["curtain", "drape", "blind", "shade", "window", "valance", "blackout"],
  "Throw Pillows": ["throw pillow", "decorative pillow", "accent pillow", "pillow cover", "cushion"],
  "Furniture": ["sofa", "couch", "bed frame", "table", "chair", "nightstand", "dresser", "desk", "bench", "ottoman", "headboard", "bookcase", "console"],
  "Mirrors": ["mirror"],
  "Shelving / Storage": ["shelf", "shelving", "basket", "storage", "organizer", "bin", "rack", "bookshelf"],
  "Plants / Greenery": ["plant", "planter", "faux plant", "greenery", "succulent", "tree", "terrarium"],
  "Hardware / Fixtures": ["knob", "pull", "handle", "showerhead", "faucet", "hardware", "towel bar", "hook"],
  "Countertop Styling": ["cutting board", "canister", "soap dispenser", "utensil holder", "tray", "fruit bowl"],
  "Towels / Bath Accessories": ["towel", "bath mat", "bath accessories", "shower curtain", "soap dish", "lotion dispenser"],
};

function detectProductCategory(productName) {
  if (!productName) return null;
  const lower = productName.toLowerCase();
  let bestMatch = null, bestScore = 0;
  for (const [cat, keywords] of Object.entries(CATEGORY_KEYWORDS)) {
    for (const kw of keywords) {
      if (lower.includes(kw) && kw.length > bestScore) {
        bestMatch = cat; bestScore = kw.length;
      }
    }
  }
  return bestMatch;
}

function validateAndFixCategories(recommendations) {
  if (!recommendations || !Array.isArray(recommendations)) return recommendations;
  return recommendations.map(rec => {
    const detected = detectProductCategory(rec.item);
    if (detected && detected !== rec.category) {
      // Product name clearly belongs to a different category — fix it
      return { ...rec, category: detected };
    }
    return rec;
  });
}

        <div style={{ marginBottom: 14 }}>

        <div style={{ marginBottom: 14 }}>

            style={{ width: "100%", padding: "12px 14px", fontSize: 15, border: "1px solid rgba(0,0,0,0.08)", borderRadius: 10, outline: "none", resize: "vertical", fontFamily: fonts, boxSizing: "border-box", background: "linear-gradient(145deg, #ffffff, #fefdfb)", boxShadow: "0 1px 2px rgba(0,0,0,0.03) inset", lineHeight: 1.5 }} />

          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>

                padding: "8px 14px", fontSize: 13, fontWeight: categories.includes(c.id) ? 600 : 400,
                color: categories.includes(c.id) ? "#92400e" : "#6b7280",
                background: categories.includes(c.id) ? "linear-gradient(145deg, #fef3c7, #fde68a)" : "linear-gradient(145deg, #ffffff, #fefdfb)",
                border: categories.includes(c.id) ? "1px solid rgba(217,119,6,0.2)" : "1px solid rgba(0,0,0,0.08)",
                borderRadius: 10, cursor: "pointer", transition: "all 0.2s",
                boxShadow: categories.includes(c.id) ? "0 2px 6px rgba(217,119,6,0.1)" : "0 1px 3px rgba(0,0,0,0.03)",
              }}>
                <span style={{ fontSize: 16 }}>{c.emoji}</span>
                <span>{categories.includes(c.id) ? "✓ " : ""}{c.label}</span>
              </button>
            ))}
          </div>
          {categories.length === 0 && <p style={{ fontSize: 12, color: "#dc2626", margin: "6px 0 0" }}>Select at least one category</p>}
        </div>
      </div>

      {error && <div style={{ background: "linear-gradient(145deg, #fef2f2, #fee2e2)", borderRadius: 12, padding: 14, border: "1px solid rgba(220,38,38,0.1)", boxShadow: "0 2px 8px rgba(220,38,38,0.04)", marginBottom: 12, textAlign: "center" }}><p style={{ fontSize: 14, color: "#dc2626", margin: 0 }}>{error}</p></div>}

      {/* Vision loading state */}
      {visionLoading && (
        <div style={{ borderRadius: 14, padding: 28, textAlign: "center", background: "linear-gradient(135deg, #1e1b2e, #2d1b69, #1e1b2e)", marginBottom: 14, border: "1px solid rgba(124,58,237,0.2)" }}>
          <div style={{ display: "inline-block", width: 36, height: 36, border: "3px solid rgba(124,58,237,0.3)", borderTopColor: "#a78bfa", borderRadius: "50%", animation: "spin 1s linear infinite", marginBottom: 12 }} />
          <p style={{ fontSize: 17, fontWeight: 700, color: "#e9d5ff", margin: "0 0 4px" }}>Reimagining your {roomName}...</p>
          <p style={{ fontSize: 13, color: "#a78bfa", margin: "0 0 2px" }}>Applying {propertyProfile.style} palette + research-backed design rules</p>
          <p style={{ fontSize: 12, color: "#7c3aed", margin: 0 }}>This takes 15–30 seconds</p>
        </div>
      )}

      {/* Vision result — before/after */}
      {visionImage && !loading && (
        <div style={{ borderRadius: 16, overflow: "hidden", marginBottom: 14, border: "1px solid rgba(124,58,237,0.15)", boxShadow: "0 4px 20px rgba(124,58,237,0.08)" }}>
          <div style={{ padding: "10px 16px", background: "linear-gradient(135deg, #1e1b2e, #2d1b69)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 18 }}>🪄</span>
              <span style={{ fontSize: 14, fontWeight: 700, color: "#e9d5ff", textTransform: "uppercase", letterSpacing: "0.06em" }}>Your Room Vision</span>
            </div>
            <div style={{ display: "flex", gap: 6 }}>
              <button onClick={generateVision} style={{ fontSize: 11, fontWeight: 600, color: "#c4b5fd", background: "rgba(124,58,237,0.2)", border: "1px solid rgba(124,58,237,0.3)", borderRadius: 6, padding: "4px 12px", cursor: "pointer" }}>↻ Regenerate</button>
              <button onClick={() => setVisionImage(null)} style={{ fontSize: 11, color: "#7c3aed", background: "rgba(124,58,237,0.1)", border: "1px solid rgba(124,58,237,0.2)", borderRadius: 6, padding: "4px 8px", cursor: "pointer" }}>✕</button>
            </div>
          </div>
          <div style={{ display: "flex", gap: 0 }}>
            <div style={{ flex: 1, position: "relative" }}>
              <img src={photo.url} alt="Current" style={{ width: "100%", height: 200, objectFit: "cover", display: "block" }} />
              <span style={{ position: "absolute", bottom: 8, left: 8, fontSize: 10, fontWeight: 700, color: "#fff", background: "rgba(0,0,0,0.7)", padding: "3px 10px", borderRadius: 6, textTransform: "uppercase", letterSpacing: "0.06em" }}>Current</span>
            </div>
            <div style={{ flex: 1, position: "relative" }}>
              <img src={`data:image/jpeg;base64,${visionImage}`} alt="Vision" style={{ width: "100%", height: 200, objectFit: "cover", display: "block" }} />
              <span style={{ position: "absolute", bottom: 8, left: 8, fontSize: 10, fontWeight: 700, color: "#fff", background: "linear-gradient(135deg, #7c3aed, #6d28d9)", padding: "3px 10px", borderRadius: 6, textTransform: "uppercase", letterSpacing: "0.06em" }}>Vision</span>
            </div>
          </div>
          <div style={{ padding: "12px 16px", background: "linear-gradient(135deg, #faf5ff, #f3e8ff)" }}>
            <p style={{ fontSize: 13, color: "#6d28d9", margin: "0 0 8px", fontWeight: 600 }}>Want to adjust? Tell the AI what to change:</p>
            <div style={{ display: "flex", gap: 6 }}>
              <input value={visionFeedback} onChange={e => setVisionFeedback(e.target.value)}
                placeholder="e.g., Keep the piano, make ceiling taller, try a darker sofa..."
                onKeyDown={e => { if (e.key === "Enter" && visionFeedback.trim()) generateVision(); }}
                style={{ flex: 1, padding: "9px 12px", fontSize: 14, border: "1px solid rgba(124,58,237,0.2)", borderRadius: 8, outline: "none", fontFamily: fonts, background: "#fff" }} />
              <button onClick={generateVision} disabled={!visionFeedback.trim() || visionLoading} style={{
                padding: "9px 16px", fontSize: 13, fontWeight: 600, color: "#fff",
                background: !visionFeedback.trim() ? "#d1d5db" : "linear-gradient(135deg, #7c3aed, #6d28d9)",
                border: "none", borderRadius: 8, cursor: !visionFeedback.trim() ? "not-allowed" : "pointer",
                whiteSpace: "nowrap", boxShadow: visionFeedback.trim() ? "0 2px 8px rgba(124,58,237,0.25)" : "none",
              }}>↻ Refine</button>
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 4, marginTop: 6 }}>
              {["Keep furniture in same spots", "Keep the TV", "Make it bolder", "Try warmer colors"].map(s => (
                <button key={s} onClick={() => setVisionFeedback(s)} style={{ fontSize: 11, color: "#7c3aed", background: "rgba(124,58,237,0.08)", border: "1px solid rgba(124,58,237,0.12)", borderRadius: 6, padding: "3px 8px", cursor: "pointer", fontFamily: fonts }}>{s}</button>
              ))}
            </div>
            <p style={{ fontSize: 12, color: "#8b5cf6", margin: "8px 0 0", fontWeight: 500 }}>Or if you like this direction, click below to find real products →</p>
          </div>
        </div>
      )}

      {/* Action buttons */}
      <div style={{ display: "flex", flexDirection: "column", gap: 8, alignItems: "center" }}>
        {/* Primary action: depends on state */}
        {visionImage ? (
          <Btn primary onClick={generate} disabled={categories.length === 0} style={{ width: "100%", maxWidth: 400 }}>🪄 Find Products to Match Vision</Btn>
        ) : photo && !visionLoading ? (
          <div style={{ display: "flex", flexDirection: "column", gap: 8, width: "100%", maxWidth: 400 }}>
            <button onClick={generateVision} disabled={visionLoading} style={{
              width: "100%", padding: "16px 24px", fontSize: 16, fontWeight: 700, color: "#fff",
              background: "linear-gradient(135deg, #7c3aed, #6d28d9, #5b21b6)",
              border: "none", borderRadius: 12, cursor: "pointer", fontFamily: fonts,
              boxShadow: "0 4px 16px rgba(124,58,237,0.35), 0 0 0 1px rgba(255,255,255,0.1) inset",
              display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
            }}>
              <span style={{ fontSize: 20 }}>🪄</span> Generate Room Vision First
            </button>
            <p style={{ fontSize: 12, color: "#7c3aed", textAlign: "center", margin: 0, lineHeight: 1.4 }}>AI will reimagine your room with your {propertyProfile.style} palette — then find real products to match</p>
            <Btn onClick={generate} disabled={categories.length === 0} style={{ width: "100%" }}>✨ Skip Vision — Design This Room</Btn>
          </div>
        ) : (
          <Btn primary onClick={generate} disabled={categories.length === 0}>✨ Design This Room</Btn>
        )}
        <Btn onClick={onSkip}>Skip →</Btn>
      </div>
    </div>
  );
}


/* ═══════════════════════════════════════════
   DESIGNER ORCHESTRATOR
   ═══════════════════════════════════════════ */

function DesignerFlow({ onSendToBuilder, onBack }) {
  // Restore saved state
  const saved = (() => { try { return JSON.parse(localStorage.getItem("designiq_designer") || "null"); } catch { return null; } })();
  const [phase, setPhase] = useState(saved?.phase || "intake");
  const [intakeData, setIntakeData] = useState(saved?.intakeData || null);
  const [profile, setProfile] = useState(saved?.profile || null);
  const [designedRooms, setDesignedRooms] = useState(saved?.designedRooms || []);
  const [currentRoom, setCurrentRoom] = useState(null);
  const [roomQueue, setRoomQueue] = useState(saved?.roomQueue || []);

  // Auto-save on state change
  useEffect(() => {
    if (phase === "intake" && !intakeData) return; // don't save empty state
    try {
      localStorage.setItem("designiq_designer", JSON.stringify({ phase: phase === "room-design" ? "room-select" : phase, intakeData, profile, designedRooms, roomQueue }));
    } catch {}
  }, [phase, intakeData, profile, designedRooms, roomQueue]);
  const [error, setError] = useState(null);
  const [customInput, setCustomInput] = useState("");

  const buildRoomList = (data) => {
    const rooms = ["Living Room"];
    const beds = parseInt(data.bedrooms) || 1;
    if (beds === 1) rooms.push("Bedroom");
    else { rooms.push("Primary Bedroom"); for (let i = 2; i <= beds; i++) rooms.push(`Bedroom ${i}`); }
    rooms.push("Kitchen");
    const baths = parseInt(data.bathrooms) || 1;
    if (baths === 1) rooms.push("Bathroom");
    else for (let i = 1; i <= baths; i++) rooms.push(`Bathroom ${i}`);
    return rooms;
  };

  const generateProfile = async (data) => {
    setIntakeData(data); setPhase("profile-loading"); setError(null);
    try {
      let msg = `Property: ${data.bedrooms}BR/${data.bathrooms}BA\n`;
      msg += `Neighborhood: ${data.neighborhood}\n`;
      msg += `Guest: ${(data.guestType || []).join(", ")}\n`;
      if ((data.colorPrefs || []).length) msg += `Color preferences: ${data.colorPrefs.join(", ")}\n`;
      if (data.existingItems) msg += `Existing items: ${data.existingItems}\n`;
      if (data.avoidNotes) msg += `Avoid: ${data.avoidNotes}\n`;
      const parsed = await callAI(PROFILE_PROMPT, msg, 1024);
      setProfile(parsed); setRoomQueue(buildRoomList(data)); setPhase("room-select");
    } catch (err) { setError(err.message); setPhase("intake"); }
  };

  const PaletteBar = ({ pal }) => {
    if (!pal) return null;
    const colors = [pal.base, pal.secondary, pal.accent, pal.neutral].filter(Boolean);
    return (
      <div className="card-inner" style={{ padding: 16, marginBottom: 14 }}>
        <div style={{ display: "flex", gap: 14, justifyContent: "center", flexWrap: "wrap", marginBottom: 10 }}>
          {colors.map((c, i) => (
            <div key={i} style={{ textAlign: "center" }}>
              <div style={{ width: 40, height: 40, borderRadius: 8, background: c.hex, border: "2px solid rgba(0,0,0,0.06)", margin: "0 auto 4px" }} />
              <div style={{ fontSize: 12, fontWeight: 600 }}>{c.name}</div>
              <div style={{ fontSize: 11, color: "#9ca3af" }}>{c.role}</div>
              {c.paintCode && <div style={{ fontSize: 8, color: "#b0b0b0", fontFamily: "monospace" }}>{c.paintCode}</div>}
            </div>
          ))}
        </div>
        <div style={{ display: "flex", height: 6, borderRadius: 3, overflow: "hidden" }}>
          {pal.base && <div style={{ flex: 6, background: pal.base.hex }} />}
          {pal.secondary && <div style={{ flex: 3, background: pal.secondary.hex }} />}
          {pal.accent && <div style={{ flex: 1, background: pal.accent.hex }} />}
        </div>
      </div>
    );
  };

  return (
    <div>
      {phase === "intake" && (
        <>
          {error && <div style={{ background: "linear-gradient(145deg, #fef2f2, #fee2e2)", borderRadius: 12, padding: 14, border: "1px solid rgba(220,38,38,0.1)", boxShadow: "0 2px 8px rgba(220,38,38,0.04)", marginBottom: 12, textAlign: "center" }}><p style={{ fontSize: 14, color: "#dc2626", margin: 0 }}>{error}</p></div>}
          <DesignerIntake onComplete={generateProfile} onBack={onBack} />
        </>
      )}

      {phase === "profile-loading" && <ResearchLoader text="Building your design profile..." />}

      {phase === "room-select" && profile && (
        <div>
          <div className="card-inner" style={{ padding: 18, marginBottom: 14 }}>
            <span style={{ fontSize: 12, fontWeight: 700, letterSpacing: "0.12em", textTransform: "uppercase", color: "#d97706" }}>Your Design Profile</span>
            <h2 style={{ fontSize: 26, fontWeight: 700, margin: "2px 0 6px", fontFamily: displayFont }}>{profile.style}</h2>
            <p style={{ fontSize: 14, color: "#4b5563", margin: 0, lineHeight: 1.5 }}>{stripCites(profile.styleRationale)}</p>
          </div>

          <PaletteBar pal={profile.colorPalette} />

          <RefineChat
            currentData={profile}
            promptTemplate={REFINE_PROFILE_PROMPT}
            onUpdate={(updated) => setProfile(updated)}
            placeholder="Ask anything about your design profile or request changes..."
            examples={["Why this style for my market?", "What would navy do to the vibe?", "Make the palette warmer", "Is this good for families?"]}
          />

          <div style={{ background: "linear-gradient(135deg, #0f1117 0%, #1a1d2b 40%, #1e1b2e 70%, #171420 100%)", borderRadius: 14, padding: 16, marginBottom: 14, color: "#fff" }}>
            <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: "0.12em", textTransform: "uppercase", color: "#fbbf24", marginBottom: 8 }}>📊 Revenue Impact of Great Design</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(110px, 1fr))", gap: 8 }}>
              {[{ s: "+35%", l: "Booking rate" }, { s: "+40%", l: "Earnings" }, { s: "~$6,790/yr", l: "Color value" }, { s: "+20%", l: "Pricing power" }].map((x, i) => (
                <div key={i} style={{ textAlign: "center" }}>
                  <div style={{ fontSize: 16, fontWeight: 700, color: "#fbbf24", fontFamily: displayFont }}>{x.s}</div>
                  <div style={{ fontSize: 9, color: "#94a3b8" }}>{x.l}</div>
                </div>
              ))}
            </div>
          </div>

          <div className="card-inner" style={{ padding: 18, marginBottom: 14 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
              <h3 style={{ fontSize: 18, fontWeight: 700, margin: 0 }}>Design Your Rooms</h3>
              <span style={{ fontSize: 13, fontWeight: 600, color: designedRooms.length === roomQueue.length ? "#059669" : "#d97706" }}>
                {designedRooms.length} of {roomQueue.length} done
              </span>
            </div>
            <div style={{ height: 4, borderRadius: 2, background: "rgba(0,0,0,0.06)", marginBottom: 12, overflow: "hidden" }}>
              <div style={{ height: "100%", borderRadius: 2, background: designedRooms.length === roomQueue.length ? "linear-gradient(90deg, #059669, #047857)" : "linear-gradient(90deg, #e8a307, #d97706)", width: roomQueue.length > 0 ? `${(designedRooms.length / roomQueue.length) * 100}%` : "0%", transition: "width 0.5s ease-out" }} />
            </div>
            <p style={{ fontSize: 14, color: "#6b7280", margin: "0 0 14px", lineHeight: 1.5 }}>
              {designedRooms.length === 0
                ? "Tap a room to start designing. Upload a photo of each room so the AI can see your actual space."
                : designedRooms.length < roomQueue.length
                  ? "Keep going! Tap any room below to design it."
                  : "All rooms designed! Review any room or send everything to your Budget Builder below."
              }
            </p>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {roomQueue.map((name, idx) => {
                const done = designedRooms.find(r => r.name === name);
                const isFirst = idx === 0 && designedRooms.length === 0;
                return (
                  <button key={name} onClick={() => { setCurrentRoom(name); setPhase("room-design"); }}
                    style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 16px", background: done ? "linear-gradient(145deg, #f0fdf4, #ecfce8)" : isFirst ? "linear-gradient(145deg, #fffbeb, #fef3c7)" : "linear-gradient(145deg, #ffffff, #fefdfb)", border: done ? "1px solid rgba(34,197,94,0.2)" : isFirst ? "1px solid rgba(217,119,6,0.2)" : "1px solid rgba(0,0,0,0.06)", borderRadius: 12, cursor: "pointer", fontFamily: fonts, textAlign: "left", boxShadow: isFirst && !done ? "0 2px 8px rgba(217,119,6,0.08)" : "0 1px 3px rgba(0,0,0,0.03)", transition: "all 0.2s" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ fontSize: 15, fontWeight: 600 }}>{name}</span>
                      {isFirst && <span style={{ fontSize: 10, fontWeight: 700, color: "#d97706", background: "rgba(217,119,6,0.1)", padding: "2px 8px", borderRadius: 6, textTransform: "uppercase", letterSpacing: "0.05em" }}>Start here</span>}
                    </div>
                    {done ? <span style={{ fontSize: 13, fontWeight: 600, color: "#059669" }}>✓ Designed</span>
                      : <span style={{ fontSize: 13, color: "#d97706", fontWeight: 600 }}>Design →</span>}
                  </button>
                );
              })}
            </div>
            <div style={{ marginTop: 10 }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: "#6b7280", marginBottom: 6 }}>Add a room:</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 8 }}>
                {["Game Room", "Dining Room", "Office", "Patio / Outdoor", "Laundry Room"].filter(r => !roomQueue.includes(r)).map(name => (
                  <button key={name} onClick={() => setRoomQueue(p => [...p, name])} style={{
                    padding: "8px 14px", fontSize: 13, fontWeight: 500, cursor: "pointer", fontFamily: fonts,
                    background: "linear-gradient(145deg, #ffffff, #fefdfb)", border: "1px solid rgba(0,0,0,0.08)",
                    borderRadius: 10, boxShadow: "0 1px 3px rgba(0,0,0,0.03)", transition: "all 0.15s",
                  }}>+ {name}</button>
                ))}
              </div>
              <div style={{ display: "flex", gap: 6 }}>
                <Input value={customInput} onChange={setCustomInput} placeholder="Or type a custom room name..." style={{ flex: 1 }} />
                <Btn small onClick={() => { if (customInput.trim()) { setRoomQueue(p => [...p, customInput.trim()]); setCustomInput(""); } }} disabled={!customInput.trim()}>+</Btn>
              </div>
            </div>
          </div>

          {designedRooms.length > 0 && (
            <div className="card-inner" style={{ padding: 18, marginBottom: 14, background: "linear-gradient(145deg, #f0fdf4, #ecfce8)", border: "1px solid rgba(5,150,105,0.15)" }}>
              <h4 style={{ fontSize: 16, fontWeight: 700, margin: "0 0 4px", color: "#065f46" }}>Ready to track your purchases?</h4>
              <p style={{ fontSize: 13, color: "#047857", margin: "0 0 12px", lineHeight: 1.5 }}>
                The Budget Builder turns your AI recommendations into a shopping tracker — edit items, track what you've ordered, and see your total spend per room.
              </p>
              <Btn primary onClick={() => onSendToBuilder(intakeData, profile, designedRooms)} style={{ background: "linear-gradient(135deg, #059669, #047857)", width: "100%" }}>
                📥 Send {designedRooms.length} Room{designedRooms.length > 1 ? "s" : ""} to Budget Builder
              </Btn>
            </div>
          )}

          <div style={{ textAlign: "center", marginTop: 16 }}>
            <button onClick={() => { if(confirm("Start over? This will clear your current design profile and room designs.")) { try { localStorage.removeItem("designiq_designer"); } catch {} setPhase("intake"); setIntakeData(null); setProfile(null); setDesignedRooms([]); setRoomQueue([]); }}} style={{ fontSize: 12, color: "#9ca3af", background: "none", border: "none", cursor: "pointer", textDecoration: "underline" }}>Start over with a new property</button>
          </div>
        </div>
      )}

      {phase === "room-design" && currentRoom && (
        <div>
          <button onClick={() => { setCurrentRoom(null); setPhase("room-select"); }} style={{ fontSize: 14, color: "#6b7280", background: "none", border: "none", cursor: "pointer", padding: 0, marginBottom: 10 }}>← Back to Rooms</button>
          <RoomDesigner roomName={currentRoom} propertyProfile={profile} intakeData={intakeData}
            existingResult={designedRooms.find(r => r.name === currentRoom) || null}
            onComplete={r => { setDesignedRooms(prev => [...prev.filter(x => x.name !== r.name), r]); setCurrentRoom(null); setPhase("room-select"); }}
            onSkip={() => { setCurrentRoom(null); setPhase("room-select"); }} />
        </div>
      )}
    </div>
  );
}

function BudgetBuilder({ initialProject, onBack }) {
  const savedProjects = (() => { try { return JSON.parse(localStorage.getItem("designiq_projects") || "null"); } catch { return null; } })();
  const [projects, setProjects] = useState(() => {
    if (initialProject) {
      const existing = savedProjects || [];
      // Merge: add initialProject if not already there
      if (!existing.find(p => p.id === initialProject.id)) return [initialProject, ...existing];
      return existing.map(p => p.id === initialProject.id ? initialProject : p);
    }
    return savedProjects || [];
  });
  const [activeId, setActiveId] = useState(initialProject?.id || null);

  // Auto-save projects
  useEffect(() => {
    try { localStorage.setItem("designiq_projects", JSON.stringify(projects)); } catch {}
  }, [projects]);
  const [showNew, setShowNew] = useState(!initialProject);
  const [newAddr, setNewAddr] = useState(""); const [newBeds, setNewBeds] = useState(""); const [newBaths, setNewBaths] = useState("");
  const [toast, setToast] = useState(null);
  const [adminUnlocked, setAdminUnlocked] = useState(false);
  const [amazonTag, setAmazonTag] = useState("");
  const [showSettings, setShowSettings] = useState(false);
  const [showTemplates, setShowTemplates] = useState(false);
  const [customRoom, setCustomRoom] = useState("");

  const active = projects.find(p => p.id === activeId);
  const updateProject = (fn) => setProjects(prev => prev.map(p => p.id === activeId ? fn(p) : p));

  const createProject = () => { if (!newAddr) return; const p = { id: uid(), address: newAddr, beds: parseInt(newBeds)||0, baths: parseInt(newBaths)||0, rooms: [], createdAt: new Date().toISOString() }; setProjects(prev => [p, ...prev]); setActiveId(p.id); setShowNew(false); setNewAddr(""); setNewBeds(""); setNewBaths(""); setToast("Created"); };
  const addRoom = (name, items) => { const its = items ? items.map(t => ({ id: uid(), name: t.name, url: t.url||"", quantity: t.qty||t.quantity||1, price: t.price||(t.priceEstimate?t.priceEstimate*100:0), vendor: t.vendor||"other", status: "planned", affiliateUrl: "", notes: t.notes||"" })) : []; updateProject(p => ({ ...p, rooms: [...p.rooms, { id: uid(), name, items: its, expanded: true }] })); setToast(`${name} added`); };
  const addItem = (rid) => updateProject(p => ({ ...p, rooms: p.rooms.map(r => r.id === rid ? { ...r, items: [...r.items, { id: uid(), name: "", url: "", quantity: 1, price: 0, vendor: "other", status: "planned", affiliateUrl: "", notes: "" }] } : r) }));
  const updateItem = (rid, iid, f, v) => updateProject(p => ({ ...p, rooms: p.rooms.map(r => r.id === rid ? { ...r, items: r.items.map(it => { if (it.id !== iid) return it; const u = { ...it, [f]: v }; if (f === "url") u.vendor = detectVendor(v); return u; }) } : r) }));
  const removeItem = (rid, iid) => updateProject(p => ({ ...p, rooms: p.rooms.map(r => r.id === rid ? { ...r, items: r.items.filter(it => it.id !== iid) } : r) }));
  const cycleStatus = (rid, iid) => updateProject(p => ({ ...p, rooms: p.rooms.map(r => r.id === rid ? { ...r, items: r.items.map(it => it.id === iid ? { ...it, status: STATUS_CYCLE[(STATUS_CYCLE.indexOf(it.status)+1)%STATUS_CYCLE.length] } : it) } : r) }));
  const getClickUrl = (item) => { if (item.affiliateUrl) return item.affiliateUrl; if (item.vendor==="amazon"&&amazonTag&&item.url) return `${cleanUrl(item.url)}${cleanUrl(item.url).includes("?")?"&":"?"}tag=${amazonTag}`; if (item.url && isRealUrl(item.url)) return cleanUrl(item.url); return buildSearchUrl(item.searchQuery || item.name, item.vendor || "amazon"); };
  const roomTotal = (room) => room.items.reduce((s, it) => s + it.quantity * it.price, 0);
  const projectTotal = active ? active.rooms.reduce((s, r) => s + roomTotal(r), 0) : 0;

  const exportCSV = () => { if (!active) return; const rows = [["Room","Item","URL","Qty","Unit Price","Total","Vendor","Status"].join(",")]; active.rooms.forEach(r => r.items.forEach(it => rows.push([r.name,`"${it.name}"`,`"${it.url}"`,it.quantity,(it.price/100).toFixed(2),((it.quantity*it.price)/100).toFixed(2),it.vendor,it.status].join(",")))); const b=new Blob([rows.join("\n")],{type:"text/csv"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=`design-iq-${active.address.replace(/\s+/g,"-")}.csv`; a.click(); setToast("Exported"); };
  const duplicateProject = () => { if(!active)return; const c=JSON.parse(JSON.stringify(active)); c.id=uid(); c.address+=" (Copy)"; c.rooms.forEach(r=>{r.id=uid();r.items.forEach(it=>it.id=uid())}); setProjects(p=>[c,...p]); setActiveId(c.id); setToast("Duplicated"); };

  return (
    <div>
      {!active && (
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>

          {showNew && (
            <div className="card-inner" style={{ padding: 18, marginBottom: 14 }}>
              <Label>Property Address</Label><Input value={newAddr} onChange={setNewAddr} placeholder="1422 Magnolia Ave, Charlotte NC" style={{ marginBottom: 10 }} />
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 12 }}><div><Label>Beds</Label><Input type="number" value={newBeds} onChange={setNewBeds} placeholder="3" /></div><div><Label>Baths</Label><Input type="number" value={newBaths} onChange={setNewBaths} placeholder="2" /></div></div>
              <div style={{ display: "flex", gap: 8 }}><Btn primary onClick={createProject} disabled={!newAddr}>Create</Btn><Btn onClick={() => setShowNew(false)}>Cancel</Btn></div>
            </div>
          )}
          {projects.length === 0 && !showNew && <div className="card-inner" style={{ padding: 32, textAlign: "center" }}><div style={{ fontSize: 32, marginBottom: 8 }}>📋</div><p style={{ fontSize: 14, color: "#6b7280", margin: 0 }}>No projects yet.</p></div>}
          {projects.map(p => <div key={p.id} onClick={() => setActiveId(p.id)} className="card-premium" style={{ padding: 18, marginBottom: 10, cursor: "pointer" }}><div style={{ fontSize: 16, fontWeight: 600 }}>{p.address}</div><div style={{ fontSize: 14, color: "#6b7280", marginTop: 2 }}>{p.beds}bd/{p.baths}ba · {p.rooms.length} rooms · {fmt(p.rooms.reduce((s,r)=>s+roomTotal(r),0))}</div></div>)}
        </div>
      )}

      {active && (
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14, flexWrap: "wrap", gap: 8 }}>
            <div>
              <button onClick={() => setActiveId(null)} style={{ fontSize: 14, color: "#6b7280", background: "none", border: "none", cursor: "pointer", padding: 0, marginBottom: 4 }}>← All Projects</button>
              <h2 style={{ fontSize: 22, fontWeight: 700, margin: 0, fontFamily: displayFont }}>{active.address}</h2>
              <p style={{ fontSize: 14, color: "#6b7280", margin: "2px 0 0" }}>{active.beds}bd / {active.baths}ba</p>
            </div>
            <div style={{ display: "flex", gap: 6 }}><Btn small onClick={exportCSV}>📥 CSV</Btn><Btn small onClick={duplicateProject}>📋 Duplicate</Btn>{adminUnlocked && <Btn small onClick={() => setShowSettings(!showSettings)}>⚙️</Btn>}</div>
          </div>

          {showSettings && adminUnlocked && <div style={{ background: "#f9fafb", borderRadius: 10, padding: 14, border: "1px solid #e5e7eb", marginBottom: 14 }}><Label>Amazon Tag</Label><Input value={amazonTag} onChange={setAmazonTag} placeholder="your-tag-20" /></div>}

          <div style={{ background: "linear-gradient(145deg, #fffbeb, #fef3c7)", borderRadius: 12, padding: "12px 16px", border: "1px solid rgba(217,119,6,0.1)", marginBottom: 14 }}>
            <p style={{ fontSize: 13, color: "#92400e", margin: 0, lineHeight: 1.6 }}>
              <strong>Your shopping tracker.</strong> Each room has the AI-recommended products with links. Tap the <strong style={{ background: "#f3f4f6", padding: "1px 6px", borderRadius: 6 }}>planned ▸</strong> badge on any item to track its status as you order and receive it. Export everything as a CSV when you're ready.
            </p>
          </div>

          <div style={{ background: "linear-gradient(135deg, #0f1117 0%, #1a1d2b 40%, #1e1b2e 70%, #171420 100%)", borderRadius: 14, padding: 16, marginBottom: 14, color: "#fff", textAlign: "center" }}>
            <div style={{ fontSize: 12, fontWeight: 600, letterSpacing: "0.1em", textTransform: "uppercase", color: "#94a3b8" }}>Total Staging Budget</div>
            <div style={{ fontSize: 26, fontWeight: 700, fontFamily: displayFont, color: "#fbbf24" }}>{fmt(projectTotal)}</div>
            <div style={{ fontSize: 13, color: "#64748b", marginTop: 4 }}>{active.rooms.length} rooms · {active.rooms.reduce((s,r)=>s+r.items.length,0)} items</div>
          </div>

          <div className="card-inner" style={{ padding: 14, marginBottom: 14 }}>
            <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 10 }}>Add Room</div>
            {!showTemplates ? (
              <div style={{ display: "flex", gap: 6 }}><Btn small primary onClick={() => setShowTemplates(true)}>📋 Template</Btn><div style={{ display: "flex", gap: 6, flex: 1 }}><Input value={customRoom} onChange={setCustomRoom} placeholder="Custom room..." style={{ flex: 1 }} /><Btn small onClick={() => { if (customRoom) { addRoom(customRoom,[]); setCustomRoom(""); }}} disabled={!customRoom}>+</Btn></div></div>
            ) : (
              <div><div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 8 }}>{Object.entries(ROOM_TEMPLATES).map(([n,its]) => <button key={n} onClick={() => { addRoom(n,its); setShowTemplates(false); }} style={{ padding: "10px 14px", fontSize: 14, fontWeight: 500, background: "#f9fafb", border: "1px solid #e5e7eb", borderRadius: 8, cursor: "pointer", textAlign: "left" }}>{n} <span style={{ fontSize: 12, color: "#6b7280" }}>~{fmt(its.reduce((s,it) => s+it.price*(it.qty||1),0))}</span></button>)}</div><button onClick={() => setShowTemplates(false)} style={{ fontSize: 13, color: "#6b7280", background: "none", border: "none", cursor: "pointer" }}>Cancel</button></div>
            )}
          </div>

          {active.rooms.map(room => (
            <div key={room.id} style={{ background: "#fff", borderRadius: 10, border: "1px solid #e5e7eb", marginBottom: 10, overflow: "hidden" }}>
              <div onClick={() => updateProject(p => ({ ...p, rooms: p.rooms.map(r => r.id === room.id ? { ...r, expanded: !r.expanded } : r) }))} style={{ padding: "12px 16px", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center", background: room.expanded ? "#fafaf9" : "#fff" }}>

              </div>

                        </div>
                        <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
                          <span style={{ fontSize: 13, color: vr.color, fontWeight: 600 }}>{vr.icon} {vr.name}</span>
                          <div style={{ display: "flex", alignItems: "center", gap: 2 }}><span style={{ fontSize: 12, color: "#6b7280" }}>Qty:</span><input type="number" value={item.quantity} onChange={e => updateItem(room.id, item.id, "quantity", parseInt(e.target.value)||1)} min={1} style={{ width: 40, padding: "3px 4px", fontSize: 14, border: "1px solid #e5e7eb", borderRadius: 4, textAlign: "center", outline: "none" }} /></div>
                          <div style={{ display: "flex", alignItems: "center", gap: 2 }}><span style={{ fontSize: 12, color: "#6b7280" }}>$</span><input value={(item.price/100).toFixed(2)} onChange={e => updateItem(room.id, item.id, "price", parseCents(e.target.value))} style={{ width: 60, padding: "3px 4px", fontSize: 14, border: "1px solid #e5e7eb", borderRadius: 4, textAlign: "right", outline: "none" }} /></div>
                          <span style={{ fontSize: 13, fontWeight: 600, color: "#059669" }}>{fmt(item.quantity*item.price)}</span>
                          <button onClick={() => cycleStatus(room.id, item.id)} title="Tap to update status" style={{ fontSize: 12, fontWeight: 600, color: sc.text, background: sc.bg, padding: "2px 10px", borderRadius: 10, border: `1px dashed ${sc.text}40`, cursor: "pointer", textTransform: "capitalize", display: "inline-flex", alignItems: "center", gap: 3 }}>{item.status} <span style={{ fontSize: 9, opacity: 0.6 }}>▸</span></button>

                        </div>
                        {adminUnlocked && item.vendor !== "amazon" && <input value={item.affiliateUrl||""} onChange={e => updateItem(room.id, item.id, "affiliateUrl", e.target.value)} placeholder="Affiliate URL" style={{ width: "100%", marginTop: 4, padding: "4px 8px", fontSize: 10, border: "1px solid #e5e7eb", borderRadius: 4, outline: "none", color: "#7c3aed" }} />}
                      </div>
                    );
                  })}
                  <div style={{ display: "flex", justifyContent: "space-between", marginTop: 10 }}>
                    <button onClick={() => addItem(room.id)} style={{ fontSize: 14, fontWeight: 600, color: "#d97706", background: "none", border: "none", cursor: "pointer" }}>+ Add Item</button>
                    <button onClick={() => { if(confirm("Delete room?")) updateProject(p=>({...p,rooms:p.rooms.filter(r=>r.id!==room.id)})); }} style={{ fontSize: 13, color: "#dc2626", background: "none", border: "none", cursor: "pointer" }}>Delete</button>
                  </div>
                </div>
              )}
            </div>
          ))}

          {active.rooms.length > 0 && (
            <div style={{ background: "#f9fafb", borderRadius: 10, padding: 14, border: "1px solid #e5e7eb", marginTop: 14 }}>
              <div style={{ fontSize: 12, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.08em", color: "#6b7280", marginBottom: 8 }}>Budget Breakdown</div>
              {active.rooms.map(r => <div key={r.id} style={{ display: "flex", justifyContent: "space-between", padding: "4px 0", fontSize: 12 }}><span>{r.name}</span><span style={{ fontWeight: 600 }}>{fmt(roomTotal(r))}</span></div>)}
              <div style={{ borderTop: "2px solid #e5e7eb", marginTop: 8, paddingTop: 8, display: "flex", justifyContent: "space-between", fontSize: 16 }}><span style={{ fontWeight: 700 }}>Total</span><span style={{ fontWeight: 700, color: "#059669" }}>{fmt(projectTotal)}</span></div>
            </div>
          )}
        </div>
      )}
      {toast && <Toast message={toast} onDone={() => setToast(null)} />}
    </div>
  );
}

              <h2 style={{ fontSize: 22, fontWeight: 700, margin: "0 0 6px", fontFamily: displayFont }}>Start with a Design Plan</h2>
              <p style={{ fontSize: 14, color: "#6b7280", margin: "0 0 14px", lineHeight: 1.6 }}>Tell us about your property → get a design profile → design rooms one at a time with real product recommendations and direct purchase links.</p>
              <span style={{ fontSize: 13, fontWeight: 600, color: "#d97706", display: "inline-flex", alignItems: "center", gap: 4 }}>Best for new properties or redesigns <span style={{ fontSize: 16 }}>→</span></span>
            </div>
            <div onClick={() => { setBuilderProject(null); setView("builder"); }} className="card-premium" style={{ padding: 28, cursor: "pointer" }}
              onMouseEnter={e => { e.currentTarget.style.borderColor = "rgba(17,24,39,0.15)"; e.currentTarget.style.boxShadow = "0 2px 8px rgba(0,0,0,0.06), 0 16px 48px rgba(0,0,0,0.06)"; e.currentTarget.style.transform = "translateY(-2px)"; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor = "rgba(217,119,6,0.08)"; e.currentTarget.style.boxShadow = "0 1px 3px rgba(0,0,0,0.04), 0 6px 24px rgba(0,0,0,0.03)"; e.currentTarget.style.transform = "translateY(0)"; }}>
              <div style={{ width: 48, height: 48, borderRadius: 12, background: "linear-gradient(135deg, #f3f4f6, #e5e7eb)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 24, marginBottom: 14 }}>📋</div>
              <h2 style={{ fontSize: 22, fontWeight: 700, margin: "0 0 6px", fontFamily: displayFont }}>Build Your Own Budget</h2>
              <p style={{ fontSize: 14, color: "#6b7280", margin: "0 0 14px", lineHeight: 1.6 }}>Jump straight in. Add rooms, fill in your own products, track orders, export.</p>
              <span style={{ fontSize: 13, fontWeight: 600, color: "#111827", display: "inline-flex", alignItems: "center", gap: 4 }}>Best for experienced operators <span style={{ fontSize: 16 }}>→</span></span>
            </div>
          </div>
        )}
        {view === "designer" && <DesignerFlow onSendToBuilder={handleDesignComplete} onBack={() => setView("home")} />}
        {view === "builder" && <BudgetBuilder initialProject={builderProject} onBack={() => setView("home")} />}
        {view !== "home" && <div style={{ textAlign: "center", marginTop: 24 }}><button onClick={() => setView("home")} style={{ fontSize: 12, color: "#6b7280", background: "none", border: "none", cursor: "pointer", textDecoration: "underline" }}>← Back to Design IQ Home</button></div>}
      </div>

      <div style={{ textAlign: "center", padding: "20px 20px", borderTop: "1px solid rgba(0,0,0,0.04)", background: "linear-gradient(180deg, transparent, rgba(0,0,0,0.01))" }}>
        <p style={{ fontSize: 11, color: "#b0ada6", margin: 0, letterSpacing: "0.01em" }}>Design IQ · Part of the Operator OS Suite · Powered by The BNB Exchange · As an Amazon Associate, we may earn from qualifying purchases.</p>
      </div>
    </div>
  );
}

// Mount the app
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<DesignIQ />);
  </script>
</body>
</html>
